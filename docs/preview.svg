<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 176" width="470" height="176" role="img" aria-label="Mockup of the NowWatching activity card on a Discord profile: Watching Series, Breaking Bad S5:E14, Ozymandias 1080p, with a progress bar reading 28:14 left.">
  <defs>
    <style>
      .f { font-family: "gg sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .head { font-size: 15px; font-weight: 700; fill: #f2f3f5; }
      .line { font-size: 12.5px; fill: #b5bac1; }
      .tiny { font-size: 10.5px; fill: #949ba4; }
      .label { font-size: 10px; font-weight: 700; fill: #b5bac1; letter-spacing: .09em; }
      .ghost { font-size: 9.5px; fill: #6d7178; letter-spacing: .06em; }
    </style>
  </defs>

  <rect x="0" y="0" width="470" height="176" rx="10" fill="#232428"/>
  <rect x="0.5" y="0.5" width="469" height="175" rx="9.5" fill="none" stroke="#2b2d31"/>

  <text x="18" y="28" class="f label">ACTIVITY</text>
  <text x="452" y="28" class="f ghost" text-anchor="end">mockup</text>

  <!-- poster slot -->
  <rect x="18" y="42" width="84" height="116" rx="6" fill="#2b2d31" stroke="#35373c"/>
  <path d="M52 88 L52 112 L72 100 Z" fill="#4e5058"/>
  <text x="60" y="132" class="f ghost" text-anchor="middle">poster</text>

  <!-- small badge, bottom right of the poster -->
  <circle cx="98" cy="154" r="11" fill="#232428"/>
  <circle cx="98" cy="154" r="8.5" fill="#5865F2"/>
  <path d="M95.5 150.5 L95.5 157.5 L101 154 Z" fill="#ffffff"/>

  <!-- text lines -->
  <text x="120" y="62" class="f head">Watching Series</text>
  <text x="120" y="85" class="f line">Breaking Bad &#183; S5:E14</text>
  <text x="120" y="104" class="f line">Ozymandias &#183; 1080p</text>

  <!-- progress -->
  <rect x="120" y="126" width="300" height="4" rx="2" fill="#4e5058"/>
  <rect x="120" y="126" width="125" height="4" rx="2" fill="#5865F2"/>
  <text x="120" y="148" class="f tiny">20:00</text>
  <text x="420" y="148" class="f tiny" text-anchor="end">28:14 left</text>
</svg>
